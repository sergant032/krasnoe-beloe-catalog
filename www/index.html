<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>Каталог торгового оборудования</title>
<style>
  :root{ --bg:#0f1216; --card:#171c22; --card2:#1f262e; --txt:#e8edf3; --dim:#8b98a6; --acc:#57b6ff; --line:#2a323b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:15px/1.35 -apple-system,Roboto,"Segoe UI",sans-serif; overscroll-behavior:none; }
  #app{ min-height:100%; display:flex; flex-direction:column; }
  header{ position:sticky; top:0; z-index:5; background:linear-gradient(#0f1216f2,#0f1216e0); backdrop-filter:blur(8px);
    padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  .searchRow{ display:flex; gap:8px; align-items:center; }
  #q{ flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:12px;
    padding:12px 40px 12px 40px; font-size:16px; outline:none; }
  #q:focus{ border-color:var(--acc); }
  .sIcon{ position:absolute; margin-left:13px; color:var(--dim); pointer-events:none; }
  #clear{ position:absolute; right:22px; background:none; border:0; color:var(--dim); font-size:20px; padding:6px; }
  .chips{ display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ white-space:nowrap; background:var(--card); border:1px solid var(--line); color:var(--dim);
    border-radius:999px; padding:7px 13px; font-size:13px; }
  .chip.on{ background:#12344d; border-color:#2a6f9e; color:#cfe9ff; }
  main{ flex:1; padding:6px 10px 90px; }
  .row{ display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px; margin:8px 0; }
  .row:active{ background:var(--card2); }
  .row .t{ flex:1; min-width:0; }
  .row .nm{ font-weight:600; font-size:15.5px; word-wrap:break-word; }
  .row .sub{ color:var(--dim); font-size:12.5px; margin-top:3px; }
  .row .pg{ flex:none; width:44px; height:44px; border-radius:10px; background:#10222f; border:1px solid #244055;
    color:#8ecbff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .code{ font-family:ui-monospace,monospace; font-size:12px; color:#9fd3ff; }
  .secH{ color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:18px 4px 2px; }
  .empty{ color:var(--dim); text-align:center; margin-top:40px; line-height:1.6; }
  /* --------- DETAIL --------- */
  #detail{ position:fixed; inset:0; z-index:20; background:var(--bg); display:none; flex-direction:column; }
  #detail.on{ display:flex; }
  .dHead{ display:flex; gap:10px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .back{ background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; font-size:14px; }
  .dTitle{ flex:1; min-width:0; }
  .dTitle .n{ font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .dTitle .c{ color:#9fd3ff; font-size:12px; font-family:ui-monospace,monospace; margin-top:2px; }
  .viewerWrap{ position:relative; background:#0b0e11; border-bottom:1px solid var(--line); }
  #viewer{ height:46vh; overflow:hidden; touch-action:none; position:relative; }
  #stage{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #cv{ display:block; background:#fff; border-radius:2px; box-shadow:0 2px 18px #0008; }
  #loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; }
  .zoomBar{ position:absolute; right:8px; bottom:8px; display:flex; gap:6px; }
  .zoomBar button{ width:38px; height:38px; border-radius:10px; background:#000000aa; color:#fff; border:1px solid #ffffff22; font-size:17px; }
  .info{ overflow-y:auto; flex:1; padding:12px 12px 40px; -webkit-overflow-scrolling:touch; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .card h3{ margin:0 0 8px; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
  .kv .k{ color:var(--dim); }
  table.comp{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.comp td{ padding:6px 4px; border-bottom:1px solid #222a33; vertical-align:top; }
  table.comp td.n{ color:var(--dim); width:26px; }
  table.comp td.q{ text-align:right; width:42px; color:#cfe9ff; }
  table.comp td.l{ text-align:right; width:52px; color:var(--dim); font-size:12px; }
  .tag{ display:inline-block; background:#10222f; border:1px solid #244055; color:#8ecbff; border-radius:8px; padding:2px 8px; font-size:12px; }
  details.raw summary{ color:var(--dim); font-size:13px; cursor:pointer; }
  details.raw pre{ white-space:pre-wrap; font-size:12.5px; color:#b7c3cf; line-height:1.45; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="searchRow" style="position:relative">
      <span class="sIcon">⌕</span>
      <input id="q" type="search" placeholder="Название элемента: полка 600, стойка, стеллаж…" autocomplete="off" spellcheck="false">
      <button id="clear" title="Очистить">✕</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="list"></main>
</div>

<div id="detail">
  <div class="dHead">
    <button class="back" id="back">‹ Назад</button>
    <div class="dTitle"><div class="n" id="dName"></div><div class="c" id="dCode"></div></div>
  </div>
  <div class="viewerWrap">
    <div id="viewer"><div id="stage"><canvas id="cv"></canvas></div></div>
    <div id="loading">Готовлю чертёж…</div>
    <div class="zoomBar"><button id="zOut">−</button><button id="zIn">+</button><button id="zFit">⤢</button></div>
  </div>
  <div class="info" id="info"></div>
</div>

<script src="data.js"></script>
<script src="pdf.min.js"></script>
<script src="worker.js"></script>
<script>
/* ------------------ данные ------------------ */
const CAT = window.CATALOG;
const norm = s => (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();
const PAGES = new Map(CAT.pages.map(p=>[p.p,p]));
const SECTIONS = [ {id:'all',name:'Все'}, {id:'part',name:'Комплектующие'}, {id:'rack',name:'Стеллажи'},
                   {id:'pallet',name:'Паллеты'}, {id:'custom',name:'Нестандарт'} ];
let filter = 'all';
const items = CAT.entries.map(e=>({ e, n: norm(e.name), c: (e.code||'').toLowerCase() }));
document.getElementById('chips').innerHTML = SECTIONS.map(s=>
  `<div class="chip${s.id===filter?' on':''}" data-id="${s.id}">${s.name}</div>`).join('');
document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
  filter = ch.dataset.id; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===ch)); render();
});

/* ------------------ поиск ------------------ */
const listEl = document.getElementById('list'), qEl = document.getElementById('q');
let timer=null;
qEl.addEventListener('input', ()=>{ clearTimeout(timer); timer=setTimeout(render,60); document.getElementById('clear').style.display = qEl.value?'block':'none'; });
document.getElementById('clear').onclick = ()=>{ qEl.value=''; render(); qEl.focus(); };
document.getElementById('clear').style.display='none';

function score(it, q){
  if (!q) return 1;
  const n = it.n, c = it.c;
  if (n === q) return 100;
  if (n.startsWith(q)) return 90 - Math.min(20, n.length - q.length);
  if (n.split(' ').some(w=>w.startsWith(q))) return 70;
  if (c && c.includes(q)) return 65;
  if (n.includes(q)) return 50 - Math.min(20, n.indexOf(q));
  // все слова запроса присутствуют
  const words = q.split(' ').filter(Boolean);
  if (words.length>1 && words.every(w=>n.includes(w))) return 40;
  return 0;
}
function render(){
  const q = norm(qEl.value);
  let res = items.filter(it => filter==='all' || it.e.sectionId===filter);
  if (q){ res = res.map(it=>({it, s:score(it,q)})).filter(x=>x.s>0).sort((a,b)=> b.s-a.s || a.it.n.length-b.it.n.length).map(x=>x.it); }
  else {
    const order = {part:0,rack:1,pallet:2,custom:3};
    res = res.slice().sort((a,b)=> (order[a.e.sectionId]??9)-(order[b.e.sectionId]??9) || a.e.page - b.e.page || a.e.name.localeCompare(b.e.name,'ru'));
  }
  const shown = res.slice(0, 80);
  if (!shown.length){ listEl.innerHTML = `<div class="empty">Ничего не найдено.<br>Попробуйте: «полка», «стойка 70», «база», «стеллаж стандартный».</div>`; return; }
  let html='', lastSec='';
  for (const it of shown){
    const e = it.e;
    if (e.section !== lastSec){ html += `<div class="secH">${e.section}</div>`; lastSec = e.section; }
    const sub = [e.code?`<span class="code">${e.code}</span>`:'', e.group?`<span>${e.group}</span>`:'', e.sheet?`<span>лист ${e.sheet}</span>`:''].filter(Boolean).join(' · ');
    html += `<div class="row" data-page="${e.page}" data-id="${e.id}">
      <div class="t"><div class="nm">${e.name}</div><div class="sub">${sub||(e.kind==='model'?'модель':'')}</div></div>
      <div class="pg">${e.page}</div></div>`;
  }
  if (res.length > shown.length) html += `<div class="empty">Показаны первые ${shown.length} из ${res.length} — уточните запрос.</div>`;
  listEl.innerHTML = html;
  listEl.querySelectorAll('.row').forEach(r => r.onclick = ()=> openDetail(+r.dataset.id));
}

/* ------------------ детальный экран ------------------ */
const detail = document.getElementById('detail'), infoEl = document.getElementById('info');
document.getElementById('back').onclick = ()=>{ detail.classList.remove('on'); };

async function openDetail(id){
  const e = CAT.entries.find(x=>x.id===id); if (!e) return;
  detail.classList.add('on');
  qEl.blur();
  document.getElementById('dName').textContent = e.name;
  document.getElementById('dCode').textContent = e.code || ('лист ' + e.page);
  const pg = PAGES.get(e.page) || {};
  let html = `<div class="card"><h3>Информация</h3><div class="kv">
      <div class="k">Раздел</div><div>${e.section}</div>
      ${e.group?`<div class="k">Группа</div><div>${e.group}</div>`:''}
      ${e.code?`<div class="k">Артикул</div><div class="code">${e.code}</div>`:''}
      <div class="k">Лист каталога</div><div>стр. ${e.page}${pg.sheet?` (лист ${pg.sheet})`:''}</div>
      ${(pg.titles&&pg.titles.length)?`<div class="k">На листе</div><div>${pg.titles.join('; ')}</div>`:''}
    </div></div>`;
  if (pg.comps && pg.comps.length){
    html += `<div class="card"><h3>Состав / комплектующие</h3><table class="comp">` +
      pg.comps.map(c=>`<tr><td class="n">${c.n}</td><td>${c.name}</td><td class="q">${c.qty??''}</td><td class="l">${c.list||''}</td></tr>`).join('') +
      `</table></div>`;
  }
  if (pg.text) html += `<div class="card"><details class="raw"><summary>Полный текст листа</summary><pre>${pg.text.replace(/</g,'&lt;')}</pre></details></div>`;
  infoEl.innerHTML = html;
  infoEl.scrollTop = 0;
  await showPage(e.page);
}

/* ------------------ рендер PDF ------------------ */
let pdfDoc = null, pdfPromise = null, currentPage = 0;
function b64ToU8(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Не удалось загрузить '+src)); document.head.appendChild(s); }); }
function ensurePdf(){
  if (pdfDoc) return Promise.resolve(pdfDoc);
  if (!pdfPromise) pdfPromise = (async ()=>{
    if (!window.PDF_B64) await loadScript('catalog.js');
    const blob = new Blob([b64ToU8(window.WORKER_B64)], {type:'text/javascript'});
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    pdfDoc = await pdfjsLib.getDocument({data: b64ToU8(window.PDF_B64)}).promise;
    return pdfDoc;
  })();
  return pdfPromise;
}
let crop = null;
function inkBox(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if (!w || !h) return null;
  const d = ctx.getImageData(0,0,w,h).data;
  let minX=w, minY=h, maxX=0, maxY=0;
  for (let y=0;y<h;y+=2){
    for (let x=0;x<w;x+=2){
      const i=(y*w+x)*4;
      if (d[i]<246 || d[i+1]<246 || d[i+2]<246){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    }
  }
  if (minX>maxX) return {x:0,y:0,w,h};
  const pad = Math.round(w*0.012);
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
  return {x:minX, y:minY, w:maxX-minX, h:maxY-minY};
}
const cv = document.getElementById('cv'), stage = document.getElementById('stage'),
      viewer = document.getElementById('viewer'), loadingEl = document.getElementById('loading');

async function showPage(num){
  if (currentPage === num) return;
  currentPage = num;
  loadingEl.style.display = 'flex'; loadingEl.textContent = 'Готовлю чертёж…';
  cv.width = 0; cv.height = 0;
  try{
    const doc = await ensurePdf();
    const page = await doc.getPage(num);
    const base = page.getViewport({scale:1});
    const vw = viewer.clientWidth || 380;
    const scale = Math.max(2.2, (vw / base.width) * 2.2);   // рендер с запасом для зума
    const vp = page.getViewport({scale});
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    loadingEl.style.display = 'none';
    try { crop = inkBox(cv); } catch(e) { crop = null; }
    fitView();
  }catch(err){
    loadingEl.style.display = 'flex'; loadingEl.textContent = 'Ошибка: ' + err.message;
  }
}

/* ------------------ зум/пан ------------------ */
let S = 1, TX = 0, TY = 0, minS = 0.1;
function apply(){ stage.style.transform = `translate(${TX}px,${TY}px) scale(${S})`; }
function fitView(){
  const vw = viewer.clientWidth, vh = viewer.clientHeight;
  if (!cv.width) return;
  const box = crop || {x:0,y:0,w:cv.width,h:cv.height};
  S = Math.min(vw / box.w, vh / box.h) * 0.99;
  minS = S * 0.5;
  TX = vw/2 - (box.x + box.w/2)*S;
  TY = vh/2 - (box.y + box.h/2)*S;
  apply();
}
function zoomAt(cx, cy, k){
  const ns = Math.min(12, Math.max(minS, S * k));
  const r = ns / S;
  TX = cx - (cx - TX) * r; TY = cy - (cy - TY) * r; S = ns; apply();
}
document.getElementById('zIn').onclick = ()=> zoomAt(viewer.clientWidth/2, viewer.clientHeight/2, 1.4);
document.getElementById('zOut').onclick = ()=> zoomAt(viewer.clientWidth/2, viewer.clientHeight/2, 1/1.4);
document.getElementById('zFit').onclick = fitView;

let pts = new Map(), lastDist = 0, lastMid = null, moved = false;
viewer.addEventListener('pointerdown', ev => {
  viewer.setPointerCapture(ev.pointerId);
  pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY}); moved = false;
});
viewer.addEventListener('pointermove', ev => {
  if (!pts.has(ev.pointerId)) return;
  const prev = [...pts.values()];
  pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pts.size === 1){
    const p = pts.get(ev.pointerId);
    TX += p.x - prev[0].x; TY += p.y - prev[0].y; moved = true; apply();
  } else if (pts.size === 2){
    const [a,b] = [...pts.values()];
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    const rect = viewer.getBoundingClientRect();
    if (lastDist) zoomAt(mid.x-rect.left, mid.y-rect.top, dist/lastDist);
    if (lastMid){ TX += mid.x-lastMid.x; TY += mid.y-lastMid.y; apply(); }
    lastDist = dist; lastMid = mid; moved = true;
  }
});
function endPointer(ev){ pts.delete(ev.pointerId); if (pts.size < 2){ lastDist = 0; lastMid = null; } }
viewer.addEventListener('pointerup', endPointer);
viewer.addEventListener('pointercancel', endPointer);
viewer.addEventListener('wheel', ev => { ev.preventDefault(); const r = viewer.getBoundingClientRect(); zoomAt(ev.clientX-r.left, ev.clientY-r.top, ev.deltaY<0?1.12:1/1.12); }, {passive:false});
let lastTap = 0;
viewer.addEventListener('pointerup', ev => {
  if (moved) return;
  const now = Date.now(); const r = viewer.getBoundingClientRect();
  if (now - lastTap < 300){ zoomAt(ev.clientX-r.left, ev.clientY-r.top, S < minS*3 ? 2 : 0.5); }
  lastTap = now;
});
window.addEventListener('resize', ()=>{ if (detail.classList.contains('on')) fitView(); });

render();
</script>
</body>
</html>
